
name: College ERP CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: college-erp-pages
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build website
        run: |
          mkdir -p build
          cp index.html style.css script.js build/
          echo "Website build completed."

      - name: Test required files
        run: |
          test -s build/index.html
          test -s build/style.css
          test -s build/script.js
          echo "All required files passed."

      - name: Package website
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-test-package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
